[project]
name = "gtfs-zone-rt-pollers"
version = "0.2.1"
requires-python = ">=3.13"
description = "Sidecar worker that polls the Amtrak live tracker and POSTs positions + trip-updates to rt-api ingest"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.28",
    "cryptography>=44",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "commitizen",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_rt_pollers"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/gtfs_zone_rt_pollers/__init__.py" = ["F401"]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
