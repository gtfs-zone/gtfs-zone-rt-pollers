[project]
name = "gtfs-zone-rt-pollers"
version = "0.3.1"
requires-python = ">=3.13"
description = "Sidecar worker that polls the Amtrak live tracker and POSTs positions + trip-updates to rt-api ingest"
license = "AGPL-3.0-or-later"
dependencies = [
    "httpx>=0.28",
    "cryptography>=44",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "commitizen",
    "deptry>=0.25.1",
    "pytest",
    "ruff",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_zone_rt_pollers"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/gtfs_zone_rt_pollers/__init__.py" = ["F401"]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vulture]
paths = ["src"]
# Used only through a framework: routes, validators, tasks, ORM fields
ignore_decorators = ["@app.*", "@router.*", "@field_validator", "@model_validator"]
ignore_names = ["cls", "model_config"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
bump_message = "chore(release): bump version $current_version -> $new_version"
annotated_tag = true
pre_bump_hooks = [
    "bash -c 'branch=$(git branch --show-current); [ \"$branch\" = \"main\" ] || { echo \"Error: cz bump must be run on main (currently on \\\"$branch\\\")\"; exit 1; }'",
]
